<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Staff Sign-in — ImmXrsive</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site">
  <div class="inner">
    <a class="brand" href="index.html">ImmXrsive Talent Directory</a>
    <span class="tag">Staff workspace</span>
  </div>
</header>
<main id="main">
  <h1>Staff sign-in</h1>
  <p class="lede">For ImmXrsive program staff. Students sign in with GitHub from <a href="account.html">their account page</a>.</p>
  <div id="notice" role="alert" aria-live="assertive"></div>
  <form class="panel" id="login-form" novalidate>
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required />
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <p><button type="submit" id="login-btn">Sign in</button></p>
  </form>
</main>
<footer class="site"><div class="inner">COSC-3506 Team 08 · Release 4</div></footer>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="staff-login.js"></script>
</body>
</html>
